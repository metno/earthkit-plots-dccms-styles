[build-system]
requires = [
  "hatchling",
  "hatch-vcs"
]
build-backend = "hatchling.build"

[project]
dependencies = [
    "earthkit-plots",
]
description = "DCCMS styles for use with earthkit-plots"
dynamic = ["version"]
license = {text = "Apache License Version 2.0"}
name = "earthkit-plots-dccms-styles"
readme = "README.md"
requires-python = ">= 3.8"
urls.Issues = "https://github.com/metno/earthkit-plots-dccms-styles.issues"
urls.Repository = "https://github.com/metno/earthkit-plots-dccms-styles/"

[tool.isort]
profile = "black"

[tool.pydocstyle]
add_ignore = ["D1", "D200", "D205", "D400", "D401"]
convention = "numpy"

[project.entry-points.'earthkit.plots.plugins']
dccms = 'earthkit_plots_dccms_styles'

# Version comes from git tags, as it did under setuptools-scm; hatch-vcs wraps
# the same machinery and writes the same _version.py.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/earthkit_plots_dccms_styles/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/earthkit_plots_dccms_styles"]

# The Magics style library is installed into the environment's data prefix, so
# it lands at <sys.prefix>/share/magics/styles/dccms -- the same layout Magics
# uses for its own libraries. Magics does not pick it up implicitly: it reads
# only its own bundled share directory unless MAGICS_STYLE_PATH says otherwise.
#
# This needs a build backend that can write to the wheel's data scheme.
# setuptools dropped `data_files` from its pyproject schema (it survives only
# via a setup.py shim), so the project builds with hatchling.
[tool.hatch.build.targets.wheel.shared-data]
"share/magics/styles/dccms" = "share/magics/styles/dccms"

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "share",
  "tools",
  "magics",
  "README.md",
]
