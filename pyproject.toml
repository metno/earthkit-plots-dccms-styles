[build-system]
requires = [
  "setuptools>=61",
  "setuptools-scm>=8"
]

[project]
dependencies = [
    "earthkit-plots",
]
description = "DCCMS styles for use with earthkit-plots"
dynamic = ["version"]
license = {text = "Apache License Version 2.0"}
name = "earthkit-plots-dccms-styles"
readme = "README.md"
requires-python = ">= 3.8"
urls.Issues = "https://github.com/metno/earthkit-plots-dccms-styles.issues"
urls.Repository = "https://github.com/metno/earthkit-plots-dccms-styles/"

[tool.isort]
profile = "black"

[tool.pydocstyle]
add_ignore = ["D1", "D200", "D205", "D400", "D401"]
convention = "numpy"

[project.entry-points.'earthkit.plots.plugins']
dccms = 'earthkit_plots_dccms_styles'

[tool.setuptools.packages.find]
where = ["src/"]

# The Magics style library under share/ is installed into the environment's
# data prefix, so it lands at <sys.prefix>/share/magics/styles/dccms -- the
# same layout Magics uses for its own libraries. Point MAGICS_STYLE_PATH at
# that directory; Magics never picks it up implicitly, it reads only its own
# bundled share directory unless that variable says otherwise.
#
# This is declared in setup.py rather than here: setuptools has dropped
# data_files from its pyproject schema, and it remains available only through
# a setup() call.

[tool.setuptools_scm]
version_file = "src/earthkit_plots_dccms_styles/_version.py"